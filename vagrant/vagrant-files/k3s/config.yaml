# ─────────────────────────────────────────────────────────────────────────────
# k3s-on-QEMU lab — all tunables live here. The Vagrantfile reads this file.
# Override arch at runtime:  K3S_ARCH=x86_64 vagrant up
# ─────────────────────────────────────────────────────────────────────────────

# aarch64 | x86_64   (env K3S_ARCH wins; default = host arch)
arch: aarch64

# Your Packer-baked boxes, per guest arch. vagrant-qemu consumes the libvirt artifact.
box:
  aarch64: nthedao2705/ubuntu2204-cisl1-arm64
  x86_64:  nthedao2705/ubuntu2204-cisl1-amd64   # placeholder — bake this before using x86_64

# Pin box versions (leave "" to take latest installed).
box_version:
  aarch64: "2026-05-20.1"
  x86_64:  ""

# Component versions
k3s_version:  "v1.30.6+k3s1"     # https://github.com/k3s-io/k3s/releases
etcd_version: "v3.5.16"          # https://github.com/etcd-io/etcd/releases

# Shared cluster join token (LAB ONLY — rotate for anything real)
cluster_token: "k3s-lab-shared-token-change-me"

# Networking — second NIC is the cluster LAN shared by all VMs.
#   macOS: via socket_vmnet (subnet MUST match socket_vmnet's, default 192.168.105.0/24)
#   Linux: via QEMU socket-multicast (mcast works on Linux; any private subnet is fine)
network:
  subnet: "192.168.105"          # nodes: .10 (lb), .11/.12 (servers), .21/.22 (agents)
  mcast:  "230.0.0.1:1234"       # Linux-only: multicast group:port for the virtual LAN

# k3s components to disable at install (passed to the server as --disable=...).
# Matches roles/k3s convention: keep bundled Traefik (ingress) + servicelb (Klipper LB),
# replace only CoreDNS (you deploy your own via the terraform k3s-resources addons).
# NOTE: cluster DNS is down until that addon runs. Set "" to keep all k3s defaults.
k3s_disable: "--disable=coredns"

# Per-role VM resources
nodes:
  lb:      { cpus: 1, memory: 1024 }
  server:  { cpus: 2, memory: 2048 }
  agent:   { cpus: 2, memory: 2048 }
