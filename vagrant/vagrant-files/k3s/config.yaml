# ─────────────────────────────────────────────────────────────────────────────
# k3s-on-QEMU lab — all tunables live here. The Vagrantfile reads this file.
# Override arch at runtime:  K3S_ARCH=x86_64 vagrant up
# ─────────────────────────────────────────────────────────────────────────────

# aarch64 | x86_64   (env K3S_ARCH wins; default = host arch)
arch: aarch64

# Your Packer-baked boxes, per guest arch. vagrant-qemu consumes the libvirt artifact.
box:
  aarch64: nthedao2705/ubuntu2204-cisl1-arm64
  x86_64:  nthedao2705/ubuntu2204-cisl1-amd64   # placeholder — bake this before using x86_64

# Pin box versions (leave "" to take latest installed).
box_version:
  aarch64: "2026-05-20.1"
  x86_64:  ""

# Component versions
k3s_version:  "v1.36.2+k3s1"     # stable channel = k8s 1.36.2 (https://github.com/k3s-io/k3s/releases)
etcd_version: "v3.6.7"           # matches k3s 1.36's bundled etcd (3.6 series)

# Shared cluster join token (LAB ONLY — rotate for anything real)
cluster_token: "k3s-lab-shared-token-change-me"

# Networking — second NIC is the cluster LAN shared by all VMs.
#   macOS: via socket_vmnet (subnet MUST match socket_vmnet's, default 192.168.105.0/24)
#   Linux: via QEMU socket-multicast (mcast works on Linux; any private subnet is fine)
network:
  subnet: "192.168.105"          # nodes: .10 (lb), .11/.12 (servers), .21/.22 (agents)
  mcast:  "230.0.0.1:1234"       # Linux-only: multicast group:port for the virtual LAN

# Extra args appended VERBATIM to `k3s server` (via server-register.sh EXTRA_ARGS).
# NOT auto-wrapped — the value must be the full flag(s), e.g. "--disable=traefik"
# (a bare "traefik" would be passed as a stray positional and k3s would fail to start).
# Disable the BUNDLED Traefik (v2.11, welded to the k3s release) so we self-manage Traefik v3
# via Helm — one controller for Kubernetes Ingress (Vault), Traefik CRD/IngressRoute
# (dashboard + Vault's ServersTransport), AND Gateway API (services deployed later; needs v3).
# We DON'T route Vault via Gateway API (BackendTLSPolicy can't verify its HTTPS backend,
# traefik/traefik#12127) — Vault stays on an Ingress. Keep servicelb (Klipper) + CoreDNS.
# The bundled Traefik's CRDs are also a broken bundle (watches traefik.io, ships
# traefik.containo.us), another reason to self-manage. Set "" to re-enable bundled defaults.
k3s_disable: "--disable=traefik"

# Per-role VM resources
nodes:
  lb:      { cpus: 1, memory: 1024 }
  server:  { cpus: 2, memory: 2048 }
  agent:   { cpus: 2, memory: 2048 }
