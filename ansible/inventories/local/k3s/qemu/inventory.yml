---
# Static inventory for the vagrant-qemu k3s lab
#   vagrant/vagrant-files/k3s/  (5 VMs on the 192.168.105.0/24 socket_vmnet segment)
#
# Connection is via ssh.config generated from the running VMs — run:
#   ./gen-ssh-config.sh
# before ansible-playbook. `cluster_ip` is each node's IP on the cluster LAN and is
# what the roles use for etcd/HAProxy/flannel wiring (NOT the SSH connection).
# `cluster_mac` is the 2nd NIC's MAC (52:54:00:ab:cd:<ip-octet>, set in the
# Vagrantfile) — the network role finds/renames that NIC to k3scl0 by it. Keep these
# in sync with vagrant/vagrant-files/k3s/Vagrantfile.
#
# In this lab etcd + HAProxy live on the SAME box (k3s-lb), so it is in both
# the `etcd` and `infra` groups.

all:
  hosts:
    k3s-lb:
      cluster_ip: 192.168.105.10
      cluster_mac: "52:54:00:ab:cd:10"
    k3s-server-1:
      cluster_ip: 192.168.105.11
      cluster_mac: "52:54:00:ab:cd:11"
    k3s-server-2:
      cluster_ip: 192.168.105.12
      cluster_mac: "52:54:00:ab:cd:12"
    k3s-agent-1:
      cluster_ip: 192.168.105.21
      cluster_mac: "52:54:00:ab:cd:21"
    k3s-agent-2:
      cluster_ip: 192.168.105.22
      cluster_mac: "52:54:00:ab:cd:22"
  children:
    etcd:
      hosts:
        k3s-lb:
    infra:
      hosts:
        k3s-lb:
      vars:
        # PostgreSQL/Citus on the lb. The Vagrantfile injects these as extra_vars on the
        # INLINE path (vagrant up/provision), but the run.sh path uses THIS external
        # inventory and never sees the Vagrantfile — so without these, pg_enabled defaults
        # to false and the whole Citus role skips silently. Mirror of config.yaml postgres:.
        # KEEP IN SYNC with vagrant/vagrant-files/k3s/config.yaml.
        pg_enabled: true
        pg_mode: citus            # citus | single
        psql_version: 16
        pg_app_db: app
        pg_app_user: app
        pg_app_password: app
        pg_listen_addresses: "*"
        citus_workers: [worker1, worker2]
        # pg_hba trust CIDRs — only used by the single-node (bare-metal) path; harmless here.
        server_cidr_range: "192.168.105.0/24"
        docker_network_cidr_range: "10.42.0.0/16"
        docker_default_cidr_range: "10.43.0.0/16"
    server:
      hosts:
        k3s-server-1:
        k3s-server-2:
    agent:
      hosts:
        k3s-agent-1:
        k3s-agent-2:
