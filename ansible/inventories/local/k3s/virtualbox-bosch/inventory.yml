---
# Static inventory for the Vagrant-bosch k3s-etcd scenario.
# Mirrors the 5-VM topology in
#   vagrant/vagrant-files/kubernetes/k3s.virtualbox.Vagrantfile
# (QEMU-lab-style: etcd + HAProxy collapsed onto `k3s-lb`, two servers, two agents.)
#
# `cluster_ip` per host is what the k3s-etcd roles use for etcd/HAProxy/flannel
# wiring (NOT the SSH connection). See host_vars/*.yml.

all:
  hosts:
    k3s-lb:
      ansible_host: 10.43.50.10
    k3s-server-1:
      ansible_host: 10.43.50.11
    k3s-server-2:
      ansible_host: 10.43.50.12
    k3s-agent-1:
      ansible_host: 10.43.50.21
    k3s-agent-2:
      ansible_host: 10.43.50.22
  children:
    etcd:
      # k3s-lb runs external etcd for the servers.
      hosts:
        k3s-lb:
    infra:
      # HAProxy TCP LB fronting kube-apiserver — collapsed onto k3s-lb.
      hosts:
        k3s-lb:
    server:
      hosts:
        k3s-server-1:
        k3s-server-2:
    agent:
      hosts:
        k3s-agent-1:
        k3s-agent-2:
