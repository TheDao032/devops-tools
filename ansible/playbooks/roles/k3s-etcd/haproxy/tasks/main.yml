---
# tasks file for k3s-etcd/haproxy — TCP load-balancer for kube-apiserver (no keepalived)
- name: Install HAProxy (Debian)
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    name: "{{ haproxy_packages_debian }}"
    state: present
    update_cache: true

- name: Install HAProxy (RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name: "{{ haproxy_packages_redhat }}"
    state: present

- name: Install HAProxy (Archlinux)
  when: ansible_facts['os_family'] == "Archlinux"
  community.general.pacman:
    name: "{{ haproxy_packages_archlinux }}"
    state: present
    update_cache: true

- name: Render HAProxy config for the k3s API
  ansible.builtin.template:
    src: k3s.haproxy.cfg.j2
    dest: "{{ haproxy_config_path }}"
    owner: root
    group: root
    mode: '0644'
    validate: "haproxy -c -f %s"
  notify: Restart haproxy

- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
