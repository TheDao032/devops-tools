---
# tasks file for k3s-etcd/dependencies — base prep for every k3s-etcd node
# retries/until on all three: the package mirrors (esp. ALARM's) intermittently drop a
# connection mid-refresh, which fails the task on a random subset of nodes and aborts the
# whole run. Retrying the fetch a few times rides out the transient instead.
- name: Install base packages (Debian)
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    name: "{{ base_packages_debian }}"
    state: present
    update_cache: true
  register: _base_pkgs
  until: _base_pkgs is succeeded
  retries: 3
  delay: 10

- name: Install base packages (RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name: "{{ base_packages_redhat }}"
    state: present
  register: _base_pkgs
  until: _base_pkgs is succeeded
  retries: 3
  delay: 10

- name: Install base packages (Archlinux)
  when: ansible_facts['os_family'] == "Archlinux"
  community.general.pacman:
    name: "{{ base_packages_archlinux }}"
    state: present
    update_cache: true          # pacman -Sy before install (refresh the sync DB)
  register: _base_pkgs
  until: _base_pkgs is succeeded
  retries: 3
  delay: 10

- name: Disable swap for the current boot
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Comment swap entries out of /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules now
  ansible.builtin.shell: "modprobe overlay && modprobe br_netfilter"
  changed_when: false

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Write k3s sysctl tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: '0644'

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false
