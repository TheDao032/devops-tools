---
# vars file for agent-register
k3s_agent_scripts:
  - agent-register.sh
  - kube-config-modify.sh
k3s_agent_scripts_path: "/usr/bin"
load_balancer_virtual_url: "https://{{ keepalived_virtual_ip }}:{{ load_balancer_port }}"
k3s_config_path: /home/vagrant/.kube/config

# containerd CRI drop-in dir. k3s generates config.toml with an `imports` glob pointing here
# (config-v3.toml.d for containerd v2 / config version 3, which is what k3s v1.36 ships).
k3s_containerd_dropin_dir: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
