---
# tasks file for dependencies
- name: Install PostgreSQL Debian OS
  block:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items: "{{ debian.common_packages }}"
    - name: Prepare PostgreSQL packages
      ansible.builtin.shell: |
        # PostgreSQL
        install -d /usr/share/postgresql-common/pgdg
        curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc

        # Create the repository configuration file:
        sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
      args:
        executable: /bin/bash
    - name: Upddate apt packages
      ansible.builtin.apt:
        update_cache: yes
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items: "{{ debian.psql_packages }}"

    - name: Copy pg_hba.conf file for psql configuration from templates
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ debian.psql_conf_folder_path }}/pg_hba.conf"
        mode: '0755'
    - name: Set correct permissions on pg_hba.conf
      ansible.builtin.file:
        path: "{{ debian.psql_conf_folder_path }}/pg_hba.conf"
        owner: postgres
        mode: '0755'
      become: true

    - name: Systemd restart PostgreSQL
      become: true
      ansible.builtin.systemd_service:
        name: "{{ debian.psql_service_name }}"
        state: restarted
        enabled: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install PostgreSQL RedHat OS
  block:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items: "{{ redhat.common_packages }}"
    - name: Prepare PostgreSQL packages
      ansible.builtin.shell: |
        # PostgreSQL
        # Install the repository RPM:
        dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm

        # Disable the built-in PostgreSQL module:
        dnf -qy module disable postgresql
      args:
        executable: /bin/bash
    - name: Upddate apt packages
      ansible.builtin.dnf:
        update_cache: yes
    - name: Install required packages
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      with_items: "{{ redhat.psql_packages }}"

    - name: Copy pg_hba.conf file for psql configuration from templates
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ redhat.psql_conf_folder_path }}/pg_hba.conf"
        mode: '0755'
    - name: Set correct permissions on pg_hba.conf
      ansible.builtin.file:
        path: "{{ redhat.psql_conf_folder_path }}/pg_hba.conf"
        owner: postgres
        mode: '0755'
      become: true

    - name: Systemd restart PostgreSQL
      become: true
      ansible.builtin.systemd_service:
        name: "{{ redhat.psql_service_name }}"
        state: restarted
        enabled: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install PostgreSQL Archlinux OS
  block:
    - name: Install PostgreSQL packages (pacman)
      community.general.pacman:
        name: "{{ archlinux.common_packages + archlinux.psql_packages }}"
        state: present
        update_cache: true

    - name: Check whether the data dir is already initialized
      ansible.builtin.stat:
        path: "{{ archlinux.psql_conf_folder_path }}/PG_VERSION"
      register: pg_data_initialized

    - name: Initialize the PostgreSQL data dir (Arch does NOT auto-initdb)
      when: not pg_data_initialized.stat.exists
      become: true
      become_user: postgres
      ansible.builtin.command:
        cmd: "initdb --locale=C.UTF-8 --encoding=UTF8 -D {{ archlinux.psql_conf_folder_path }}"

    - name: Copy pg_hba.conf file for psql configuration from templates
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ archlinux.psql_conf_folder_path }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Systemd start + enable PostgreSQL
      become: true
      ansible.builtin.systemd_service:
        name: "{{ archlinux.psql_service_name }}"
        state: started
        enabled: true
  when: ansible_facts['os_family'] == "Archlinux"
