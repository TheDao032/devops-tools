---
# k3s HA cluster with EXTERNAL etcd datastore + HAProxy (no keepalived).
# Topology (groups): etcd (datastore) → infra (HAProxy) → server (control-plane) → agent (workers).
# In the QEMU lab, etcd + infra collapse onto one host (k3s-lb).
#
# Run:  ansible-playbook -i inventories/local/k3s/qemu/inventory.yml playbooks/k3s-etcd-playbooks/site.yml

- name: Wait for every node to be SSH-reachable
  hosts: all
  gather_facts: false        # must not gather facts here — that needs SSH and would
  become: false              # fail on a slow-booting VM before this gate can run
  tasks:
    # QEMU VMs boot in parallel and at uneven speeds; a lagging node's sshd may not be
    # up when Ansible first connects, which otherwise fails the run with unreachable=1.
    # wait_for_connection retries the connection until it succeeds (or timeout).
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

- name: Base dependencies + cluster network on all nodes
  hosts: all
  become: true
  become_user: root
  tasks:
    - name: Ping all nodes
      ansible.builtin.ping:
  roles:
    # OS prereqs (packages, swap, kernel modules, sysctl) — os_family-branched.
    - role: ../roles/k3s-etcd/dependencies
    # Rename the 2nd NIC -> k3scl0 + static IP + /etc/hosts. Replaces the old
    # provision/common.sh shell provisioner; netplan vs systemd-networkd is chosen
    # by ansible_facts.os_family. Must run before etcd/haproxy/k3s.
    - role: ../roles/k3s-etcd/network

- name: External etcd datastore
  hosts: etcd
  become: true
  become_user: root
  roles:
    - role: ../roles/k3s-etcd/etcd

- name: HAProxy API load-balancer
  hosts: infra
  become: true
  become_user: root
  roles:
    - role: ../roles/k3s-etcd/haproxy

# PostgreSQL on the lb node (NOT in-cluster). Toggle with postgres.enabled (pg_enabled) and
# postgres.mode (pg_mode) in config.yaml. Services connect at the lb's cluster IP.
#   pg_mode == 'single' -> bare-metal Postgres: `dependencies` (os_family-branched incl.
#                          Archlinux) installs it, `single-node` opens it on the LAN + makes
#                          the app db/role. One instance on :5432.
#   pg_mode == 'citus'  -> `citus-docker`: Alpine/aarch64-native Citus dev cluster (coordinator
#                          + N workers + pgbouncer) as Docker containers. NO repmgr. Direct
#                          coordinator :5432 (scram), pooled pgbouncer :6432 (trust). Chosen
#                          because citusdata's apt repo + official image are amd64-only.
- name: PostgreSQL on the lb node (single bare-metal OR dockerized Citus cluster)
  hosts: infra
  become: true
  become_user: root
  roles:
    - role: ../roles/postgresql/dependencies
      when:
        - pg_enabled | default(false) | bool
        - (pg_mode | default('single')) == 'single'
    - role: ../roles/postgresql/single-node
      when:
        - pg_enabled | default(false) | bool
        - (pg_mode | default('single')) == 'single'
    - role: ../roles/postgresql/citus-docker
      when:
        - pg_enabled | default(false) | bool
        - (pg_mode | default('single')) == 'citus'

- name: k3s control-plane servers (external datastore)
  hosts: server
  become: true
  become_user: root
  serial: 1                 # first server initialises cluster state in etcd, then the next joins
  roles:
    - role: ../roles/k3s-etcd/server

- name: k3s agents (join via HAProxy VIP)
  hosts: agent
  become: true
  become_user: root
  roles:
    - role: ../roles/k3s-etcd/agent
